# Production compose. Lives on the remote server at /opt/brickfinder/.
# Image tag is rewritten by CI/CD; ${IMAGE_TAG} default is "latest".
services:
  postgres:
    image: swr.cn-north-4.myhuaweicloud.com/bricksplan/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: swr.cn-north-4.myhuaweicloud.com/bricksplan/redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: swr.cn-north-4.myhuaweicloud.com/bricksplan/brickfinder-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: prod
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      BRICKOGNIZE_BASE_URL: https://api.brickognize.com
      BRICKOGNIZE_TIMEOUT_SECONDS: "30"
      RATE_LIMIT_RECOGNIZE_PER_DAY: "100"
      CIRCUIT_BREAKER_THRESHOLD: "10"
      CIRCUIT_BREAKER_COOLDOWN_SECONDS: "30"
      UPLOAD_MAX_BYTES: "8388608"
    ports:
      - "8000:8000"

volumes:
  pgdata:
  redisdata:
