name: brickfinder
description: "Lego photo build finder"
publish_to: 'none'
version: 0.2.0

environment:
  sdk: ^3.2.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.0.0
  provider: ^6.1.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  http: ^1.2.0
  image_picker: ^1.0.0
  image: ^4.0.0
  intl: ^0.19.0
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_intl:
  enabled: true
  class_name: AppLocalizations
  main_locale: zh
  arb_dir: lib/l10n
  output_dir: lib/l10n/generated
