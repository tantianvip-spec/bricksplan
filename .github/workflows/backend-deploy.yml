name: backend-deploy

on:
  workflow_run:
    workflows: ["backend-image"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: latest)"
        required: false
        default: "latest"

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Compute lowercase owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          timeout: 15m
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/brickfinder

            # Update image coordinates in .env without touching secrets.
            _set_env() {
              local key="$1"
              local value="$2"
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
              else
                echo "${key}=${value}" >> .env
              fi
            }
            _set_env GHCR_OWNER ${{ steps.owner.outputs.value }}
            _set_env IMAGE_TAG ${{ steps.tag.outputs.value }}

            # Pull may take several minutes from GHCR on servers in mainland China.
            docker compose pull backend
            docker compose up -d --remove-orphans

            # Smoke test /health with retries (up to ~5 minutes).
            ok=0
            for i in $(seq 1 60); do
              if curl -fsS http://localhost:8000/health >/dev/null; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then
              echo "Health check failed; container logs:" >&2
              docker compose logs --tail=200 backend || true
              exit 1
            fi
            echo "Deployed: tag=${{ steps.tag.outputs.value }}"
