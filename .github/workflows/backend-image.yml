name: backend-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  SWR_REGISTRY: swr.cn-north-4.myhuaweicloud.com
  SWR_ORG: bricksplan
  SWR_IMAGE: brickfinder-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Huawei Cloud SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Push base images to SWR
        run: |
          docker pull postgres:16-alpine
          docker tag postgres:16-alpine ${{ env.SWR_REGISTRY }}/${{ env.SWR_ORG }}/postgres:16-alpine
          docker push ${{ env.SWR_REGISTRY }}/${{ env.SWR_ORG }}/postgres:16-alpine
          docker pull redis:7-alpine
          docker tag redis:7-alpine ${{ env.SWR_REGISTRY }}/${{ env.SWR_ORG }}/redis:7-alpine
          docker push ${{ env.SWR_REGISTRY }}/${{ env.SWR_ORG }}/redis:7-alpine

      - name: Compute lowercase owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ steps.owner.outputs.value }}/brickfinder-backend
            ${{ env.SWR_REGISTRY }}/${{ env.SWR_ORG }}/${{ env.SWR_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=tag

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
